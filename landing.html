<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>CAP MUSIQUE | CEAA-Kpalimé - Cours Préparatoire 2026-2027</title>
    
    <!-- Police Premium Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* 🎨 Reset & Base */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
            color: #ffffff;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); /* Fallback si vidéo lente */
        }

        /* 🎥 Vidéo de fond */
        .bg-video {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            object-fit: cover;
            z-index: -2;
        }

        /* 🌑 Overlay sombre pour lisibilité */
        .bg-overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.82);
            z-index: -1;
        }

        /* 📦 Conteneur Principal */
        .landing-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            text-align: center;
            position: relative;
        }

        /* ✨ Carte Glassmorphism */
        .landing-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2.5rem 1.5rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 🔠 Typographie */
        .logo-icon { font-size: 3rem; margin-bottom: 0.75rem; display: block; }
        h1 { font-size: clamp(2rem, 5vw, 2.5rem); font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.25rem; }
        .subtitle { font-size: clamp(0.95rem, 2vw, 1.1rem); color: #cbd5e1; margin-bottom: 1.5rem; font-weight: 400; }

        /* ✅ Liste des avantages */
        .features { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 2rem; text-align: left; }
        .feature-item { display: flex; align-items: center; gap: 0.6rem; font-size: 0.95rem; color: #f1f5f9; }
        .check-icon { color: #34d399; font-size: 1.1rem; flex-shrink: 0; }

        /* 🔘 Bouton CTA */
        .btn-cta {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            font-size: 1rem; font-weight: 700;
            padding: 0.875rem 1.5rem;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
            border: 1px solid rgba(255,255,255,0.2);
            width: 100%;
        }
        .btn-cta:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(37, 99, 235, 0.5); }

        /* 🦶 Footer discret */
        .landing-footer { margin-top: 2rem; font-size: 0.75rem; color: #64748b; }
        .landing-footer a { color: #94a3b8; text-decoration: none; }
    </style>
</head>
<body>

    <!-- 🎥 Vidéo de fond (fonctionne mobile + desktop) -->
    <video class="bg-video" autoplay muted loop playsinline preload="auto" poster="assets/icon-192.png">
        <source src="assets/bg-video.mp4" type="video/mp4">
    </video>
    
    <!-- 🌑 Overlay -->
    <div class="bg-overlay"></div>

    <!-- 📦 Contenu Principal -->
    <main class="landing-container">
        <div class="landing-card">
            <span class="logo-icon">🎵</span>
            <h1>CAP MUSIQUE</h1>
            <p class="subtitle">Cours Préparatoire 2026-2027<br><strong>CEAA-Kpalimé</strong></p>

            <!-- Avantages (court) -->
            <div class="features">
                <div class="feature-item"><span class="check-icon">✅</span> <span>Solfège • Instruments • Chant</span></div>
                <div class="feature-item"><span class="check-icon">✅</span> <span>Partitions PDF & Vidéos</span></div>
                <div class="feature-item"><span class="check-icon">✅</span> <span>Accès mobile 24/7</span></div>
            </div>

            <!-- Bouton d'Action -->
            <a href="login.html" class="btn-cta">🚀 Accéder aux cours</a>
        </div>

        <div class="landing-footer">
            <p>&copy; 2026-2027 CEAA-Kpalimé</p>
            <p><a href="tel:+22870424196">📞 +228 70 42 41 96</a></p>
        </div>
    </main>

</body>
</html>
